<title>Fixture: ZIP grande</title>
<!--
  Lote grande (paso 10, opt-in con E2E_LARGE=1): 30 PNG de ruido incompresible de ~8 MB cada uno (/noise.png?mb=8&seed=1..30,
  deterministas por semilla), renderizados a 300×200 con loading="eager". La página tarda en cargar (~250 MB): el test usa
  waitUntil 'domcontentloaded' y no espera a 'load'. Convención: data-expect = ruta resuelta esperada; data-expect-kind = kind.
  Esta página queda fuera de test/unit/fixtures-pages.test.js a propósito (30 × 8 MB no caben en la suite unitaria) y su
  cabecera usa la forma colapsada, que expectedIds() no parsea; las convenciones las valida test/e2e/downloads-large.test.js.
  expect (no parseado): #n1..#n30 → /noise.png?mb=8&seed=N (http|30 entradas noise.png, noise (2).png … noise (30).png en un ZIP STORE de ~240 MB por blob URL del offscreen)
-->
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  img { display: block; background: #eee; }
</style>
</head>
