<title>Fixture: fuentes especiales</title>
<!--
  Fuentes que no son una URL http normal: data:, blob: (viva y revocada), canvas (limpio y contaminado), SVG inline y póster de vídeo.
  Convención: data-expect = ruta/URL esperada para http y data ("(src)" = la propia src del elemento), o la extensión esperada del
  archivo descargado para los tipos byte (blob/canvas/svg); data-expect-kind = kind del ImageRef; data-expect-skip = motivo por el que NO debe aceptarse;
  data-expect-error = código de error esperado en lugar de descarga.
  expect: #data → (src) (data|PNG 32×32 con ruido, 3,2 KB: supera placeholderDataMax y no es píxel → descarga directa como .png)
  skip: #data-pixel → PNG real de 2×2 y 79 B (data-expect-skip="pixel"): natural ≤2 → regla pixel; además data ≤1 KB → placeholder; sin chip
  expect: #blob-live → png (blob|blob: viva creada desde fetch('/img/b.png?w=300&h=300'); fetch en el marco → PNG 300×300)
  expect: #blob-revoked → png (blob|misma blob: revocada tras 'load' (data-revoked="1"); fetch falla → recodificar desde el <img> a PNG)
  expect: #canvas2d → png (canvas|toBlob → PNG 300×300 dibujado con fillRect)
  expect: #canvas-tainted → ERR_TAINTED_CANVAS (canvas|dibujado con imagen del origen ALTERNO sin CORS (data-tainted="1") → SecurityError, sin descarga)
  expect: #svg → svg (svg|inline 200×200, fill por clase CSS y <use href="#sym"> cuyo <symbol id="sym"> vive en otro <svg> oculto → la exportación debe incluir <symbol>)
  expect: #video → /img/poster.png?w=400&h=300 (http|póster de <video> sin fuente)
  huge: #blob-huge → ERR_TOO_BIG_ITEM (blob|<img> con blob: de 40 MB tipada image/png que NO decodifica (naturalWidth 0, complete): el resolver da kind blob
         desde src; al seleccionarla el Blob supera maxItemBytes (32 MiB) → toast ERR_TOO_BIG_ITEM y no queda seleccionada. Sin data-expect ni
         data-expect-kind a propósito: los tests que esperan a que toda blob: con data-expect-kind cargue no deben contarla; lleva data-expect-error.)
-->

  canvas, img, svg, video { display: block; background: #eee; }
  .logo .bg { fill: #ffd166; }
  .logo .star { fill: #ef476f; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>

<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="sym" viewBox="0 0 24 24">
    <path class="star" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21l1.6-7L2 9.3l7.1-.7z"/>
  </symbol>
</svg>

<script>
  'use strict';
  // Origen alterno: mismo puerto, el otro host (127.0.0.1 <-> localhost)
  const ALT = location.protocol + '//' + (location.hostname === 'localhost' ? '127.0.0.1' : 'localhost') + ':' + location.port;

  // blob: viva y blob: revocada tras cargar
  async function loadBlob(img, revoke) {
    const res = await fetch('/img/b.png?w=300&h=300');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (revoke) {
      img.addEventListener('load', () => {
        URL.revokeObjectURL(url);
        img.dataset.revoked = '1';
      }, { once: true });
    }
    img.src = url;
  }
  loadBlob(document.getElementById('blob-live'), false);
  loadBlob(document.getElementById('blob-revoked'), true);

  // blob: de 40 MB tipada image/png que no decodifica (ceros): supera maxItemBytes al seleccionarla
  const huge = document.getElementById('blob-huge');
  huge.addEventListener('error', () => { huge.dataset.huge = 'error'; }, { once: true });
  huge.src = URL.createObjectURL(new Blob([new Uint8Array(40 << 20)], { type: 'image/png' }));

  // canvas 2D limpio
  const c2d = document.getElementById('canvas2d').getContext('2d');
  c2d.fillStyle = '#1a73e8';
  c2d.fillRect(0, 0, 300, 300);
  c2d.fillStyle = '#ffffff';
  c2d.fillRect(75, 75, 150, 150);

  // canvas contaminado: imagen cross-origin sin atributo crossorigin
  const tainted = document.getElementById('canvas-tainted');
  const tctx = tainted.getContext('2d');
  const timg = new Image();
  timg.addEventListener('load', () => {
    tctx.drawImage(timg, 0, 0, 300, 300);
    tainted.dataset.tainted = '1';
  });
  timg.addEventListener('error', () => { tainted.dataset.tainted = 'error'; });
  timg.src = ALT + '/img/t.png?w=300&h=300';
</script>
